<section id="projects" class="resume" aria-labelledby="projects-heading">
    <div class="container">
        <div class="section-title">
            <h2 id="projects-heading">Personal Projects</h2>
        </div>
        <div class="row" data-aos="fade-left">
            {{ range .Site.RegularPages }}
            {{ if eq .Page.Section "projects"}}
            <div class="col-lg-6">
                <div class="resume-item">
                    <h4>{{ .Title }} {{ range .Params.tech }}<span class="tech">{{ . }}.</span>{{ end }}</h4>
                    {{ if .Params.project_url }}<h4><a href="{{ .Params.project_url }}" target="_blank" rel="noopener noreferrer" aria-label="Visit {{ .Title }} project">{{ .Params.project_url }}</a></h4>{{ end }}
                    <h5>{{ .Params.dates }}</h5>
                    {{ .Content }}
                </div>
            </div>
            {{ end }}
            {{ end }}
        </div>
    </div>
</section>
