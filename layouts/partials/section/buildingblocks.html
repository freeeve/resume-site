<section id="competencies" class="services">
    <div class="container">
        <div class="section-title">
            <h2>Building Blocks</h2>
        </div>
        <div class="row" data-aos="fade-left">
            {{ range where .Site.RegularPages "Section" "buildingblocks" }}
            <div class="col-lg-12 col-md-12 buildingblocks-category">
                <h5>{{ .Title }}</h5>
                <div class="tech-grid">
                    {{ range .Params.blocks }}
                    <div class="tech-item" data-tooltip="{{ .alt }}">
                        <img src="{{ .icon }}" alt="{{ .alt }}" loading="lazy" decoding="async">
                    </div>
                    {{ end }}
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</section>
